apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: platform
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      serviceAccountName: frontend
      nodeSelector:
        platform-worker: 'true'
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: frontend
      imagePullSecrets:
      - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      volumes: []
      containers:
      - name: frontend
        image: ghcr.io/replace-me/frontend:configure-me
        imagePullPolicy: IfNotPresent
        volumeMounts: []
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        env: []
        envFrom: []
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        ports:
        - name: http
          containerPort: 3000
        startupProbe:
          tcpSocket:
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
