apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: training-gpu
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: MultiKueueCluster
metadata:
  name: eks-a
spec:
  clusterSource:
    kubeConfig:
      locationType: Secret
      location: eks-a-kubeconfig
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: MultiKueueCluster
metadata:
  name: eks-b
spec:
  clusterSource:
    kubeConfig:
      locationType: Secret
      location: eks-b-kubeconfig
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: MultiKueueCluster
metadata:
  name: eks-c
spec:
  clusterSource:
    kubeConfig:
      locationType: Secret
      location: eks-c-kubeconfig
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: MultiKueueConfig
metadata:
  name: eks-training
spec:
  clusters:
  - eks-a
  - eks-b
  - eks-c
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: AdmissionCheck
metadata:
  name: multikueue
spec:
  controllerName: kueue.x-k8s.io/multikueue
  parameters:
    apiGroup: kueue.x-k8s.io
    kind: MultiKueueConfig
    name: eks-training
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: manager-training-pool
spec:
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: training
  queueingStrategy: BestEffortFIFO
  admissionChecksStrategy:
    admissionChecks:
    - name: multikueue
  resourceGroups:
  - coveredResources:
    - cpu
    - memory
    - nvidia.com/gpu
    flavors:
    - name: training-gpu
      resources:
      - name: cpu
        nominalQuota: 96
      - name: memory
        nominalQuota: 384Gi
      - name: nvidia.com/gpu
        nominalQuota: 12
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: training-queue
  namespace: training
spec:
  clusterQueue: manager-training-pool
