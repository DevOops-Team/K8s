apiVersion: v1
kind: ServiceAccount
metadata:
  name: recovery-controller
  namespace: platform
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: recovery-controller-config
  namespace: platform
data:
  config.json: "{\n  \"schema_version\": 1,\n  \"mode\": \"observe\",\n  \"event_source\"\
    : \"disabled\",\n  \"execution_enabled\": false\n}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recovery-controller
  namespace: platform
spec:
  replicas: 0
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: recovery-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recovery-controller
    spec:
      serviceAccountName: recovery-controller
      automountServiceAccountToken: false
      nodeSelector:
        platform-worker: 'true'
      imagePullSecrets:
      - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: controller
        image: ghcr.io/replace-me/recovery-controller:configure-me
        ports:
        - name: health
          containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /etc/recovery
          readOnly: true
        imagePullPolicy: IfNotPresent
        env:
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: PYTHONUNBUFFERED
          value: '1'
        startupProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 5
          failureThreshold: 12
      volumes:
      - name: config
        configMap:
          name: recovery-controller-config
      terminationGracePeriodSeconds: 30
  strategy:
    type: Recreate
  progressDeadlineSeconds: 180
