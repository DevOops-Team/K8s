apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-cert-manager-cainjector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
spec:
  project: gpu-platform
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    syncOptions:
    - CreateNamespace=false
    - FailOnSharedResource=true
    - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  source:
    repoURL: https://github.com/DevOops-Team/K8s.git
    targetRevision: develop
    path: onprem/platform/cert-manager/cainjector
