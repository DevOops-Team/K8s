apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-queues-eks-c
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: gpu-platform
  destination:
    name: eks-c
    namespace: training
  syncPolicy:
    syncOptions:
    - CreateNamespace=false
    - FailOnSharedResource=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  source:
    repoURL: https://github.com/DevOops-Team/K8s.git
    targetRevision: develop
    path: scheduling/workers/eks-c
