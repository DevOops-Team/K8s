apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
spec:
  project: gpu-platform
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-system
  syncPolicy:
    syncOptions:
    - CreateNamespace=false
    - FailOnSharedResource=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  sources:
  - repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 42.2.0
    helm:
      releaseName: traefik
      valueFiles:
      - $values/platform/traefik/values.yaml
  - repoURL: https://github.com/DevOops-Team/K8s.git
    targetRevision: develop
    ref: values
