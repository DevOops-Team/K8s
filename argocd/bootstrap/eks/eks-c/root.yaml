apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-root-eks-c
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DevOops-Team/K8s.git
    targetRevision: develop
    path: argocd/applications/eks/eks-c
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
    - CreateNamespace=false
    - FailOnSharedResource=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
