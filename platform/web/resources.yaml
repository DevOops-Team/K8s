apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-cloudflare-production
spec:
  acme:
    email: replace-me@example.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-cloudflare-production-account
    solvers:
    - selector:
        dnsZones:
        - devoops.site
      dns01:
        cloudflare:
          apiTokenSecretRef:
            name: cloudflare-dns-api-token
            key: api-token
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: frontend-tls
  namespace: platform
spec:
  secretName: frontend-tls
  dnsNames:
  - devoops.site
  issuerRef:
    name: letsencrypt-cloudflare-production
    kind: ClusterIssuer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: platform
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - devoops.site
    secretName: frontend-tls
  rules:
  - host: devoops.site
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
