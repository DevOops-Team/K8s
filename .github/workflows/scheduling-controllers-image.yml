# 스케줄링 컨트롤러(dispatcher·relocator) 이미지 -> ghcr.io/devoops-team/scheduling-controllers
# - PR: 테스트 + 빌드만 (push 안 함)
# - develop·main push / 수동 실행: 테스트 -> 빌드 -> GHCR push
# 배포 매니페스트에는 태그 말고 digest(@sha256:...)로 고정한다. digest는 실행 요약(Summary)에 남는다.
name: scheduling-controllers-image

on:
  push:
    branches: [develop, main]
    paths:
      - scheduling/controllers/**
      - .github/workflows/scheduling-controllers-image.yml
  pull_request:
    paths:
      - scheduling/controllers/**
      - .github/workflows/scheduling-controllers-image.yml
  workflow_dispatch:

# 액션은 커밋 SHA로 고정 (packages: write 토큰을 쓰므로 태그 바꿔치기 방지). 올릴 땐 SHA와 버전 주석을 같이
permissions:
  contents: read

concurrency:
  group: scheduling-controllers-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/devoops-team/scheduling-controllers   # GHCR 이름은 소문자만
  CONTEXT: scheduling/controllers

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scheduling/controllers
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"          # Dockerfile 베이스와 같게
          cache: pip
          cache-dependency-path: scheduling/controllers/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest -v test_*.py   # 쿠버네티스·AWS 없이 돈다

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                     # GHCR push (GITHUB_TOKEN)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f   # v3.12.0
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550   # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051   # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=scheduling-controllers
            org.opencontainers.image.description=GPU failover scheduling controllers (dispatcher, relocator)
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8   # v6.19.2
        with:
          context: ${{ env.CONTEXT }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### scheduling-controllers"
            echo
            echo '```'
            echo "${IMAGE}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
