# 컨트롤러 이미지 CI (GPU-127 · ADR-23). 폴더 하나 = 이미지 하나.
#
#   이미지                                     폴더(Dockerfile)                 테스트
#   ghcr.io/devoops-team/recovery-controller   recovery-controller/             recovery-controller/tests
#   ghcr.io/devoops-team/dispatcher            scheduling/dispatcher/           scheduling/{common,dispatcher}
#   ghcr.io/devoops-team/relocator             scheduling/relocator/            scheduling/{common,relocator}
#
#   PR(→ develop, → main), develop push : 세 이미지 모두 테스트 + 이미지 빌드 (push 안 함)
#   main push(머지)                     : 같은 검사 → 바뀐 이미지만 push {main, sha-<7자리>}
#                                         → Variable DEPLOY_IMAGES에 든 이미지만 Gitops overlay digest 갱신 (봇)
#
# 바뀐 이미지 판단: 자기 폴더 · scheduling/common(디스패처 · 재배치) · 이 파일.
#   안 바뀐 이미지를 다시 push하면 digest가 달라져 봇이 불필요한 재배포를 하므로 main에서도 바뀐 것만 push한다.
# 배포 켜기: Gitops에 onprem/controllers/<이름>/overlays/onprem (images 항목 포함)을 만든 뒤
#   K8s 레포 Variable DEPLOY_IMAGES에 이름을 쉼표로 추가한다. 예) dispatcher,recovery-controller
# 새 이미지 추가: 아래 matrix.include와 changes job의 paths에 한 줄씩.
#
# 액션은 커밋 SHA로 고정 (packages: write 토큰을 쓰므로). dependabot이 주 1회 갱신 PR을 올린다.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # main push에서 push · 배포할 이미지 고르기. PR · develop은 결과와 관계없이 전부 빌드만 한다.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.diff.outputs.images }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          all="recovery-controller dispatcher relocator"
          if [ "$EVENT" != push ] || [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            images="$all"
          else
            files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            printf '바뀐 파일:\n%s\n' "$files"
            has() { grep -qE "$1" <<<"$files"; }
            images=""
            if has '^\.github/workflows/ci\.yml$'; then images="$all"; else
              has '^recovery-controller/'                          && images+=" recovery-controller"
              has '^scheduling/(common|dispatcher)/'              && images+=" dispatcher"
              has '^scheduling/(common|relocator)/'               && images+=" relocator"
            fi
          fi
          images=$(echo $images)
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "### 대상 이미지: ${images:-(없음)}" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.name }} · test · image
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                     # GHCR push (GITHUB_TOKEN)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: recovery-controller
            context: recovery-controller
            dockerfile: recovery-controller/Dockerfile
            requirements: recovery-controller/requirements.txt requirements-dev.txt
            test: cd recovery-controller && python -m unittest discover -s tests -v
          - name: dispatcher
            context: scheduling
            dockerfile: scheduling/dispatcher/Dockerfile
            requirements: scheduling/common/requirements.txt
            test: >-
              python -m unittest discover -s scheduling/common -p 'test_*.py' -v &&
              python -m unittest discover -s scheduling/dispatcher -p 'test_*.py' -v
          - name: relocator
            context: scheduling
            dockerfile: scheduling/relocator/Dockerfile
            requirements: scheduling/common/requirements.txt
            test: >-
              python -m unittest discover -s scheduling/common -p 'test_*.py' -v &&
              python -m unittest discover -s scheduling/relocator -p 'test_*.py' -v
    env:
      IMAGE: ghcr.io/devoops-team/${{ matrix.name }}     # GHCR 이름은 소문자만
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(format(' {0} ', needs.changes.outputs.images), format(' {0} ', matrix.name)) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"          # Dockerfile 베이스와 같게
      - name: pip install
        run: python -m pip install --disable-pip-version-check -q $(printf -- '-r %s ' ${{ matrix.requirements }})
      - name: unittest
        run: ${{ matrix.test }}           # 쿠버네티스 · AWS 없이 돈다

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f   # v3.12.0
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9   # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051   # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8   # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # matrix job 출력은 마지막 한 개만 남으므로 이미지별 digest는 artifact로 넘긴다.
      - name: Record digest
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          printf '{"name":"%s","image":"%s","digest":"%s"}\n' "${{ matrix.name }}" "$IMAGE" "$DIGEST" > "digests/${{ matrix.name }}.json"
          echo "### ${{ matrix.name }}: \`${IMAGE}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
      - if: env.PUSH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: digest-${{ matrix.name }}
          path: digests/${{ matrix.name }}.json
          retention-days: 1

  # push한 이미지 중 DEPLOY_IMAGES에 든 것만 배포 대상으로 묶는다.
  deploy-targets:
    name: deploy targets
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      count: ${{ steps.pick.outputs.count }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - id: pick
        env:
          DEPLOY_IMAGES: ${{ vars.DEPLOY_IMAGES }}
        run: |
          shopt -s nullglob
          files=(digests/*.json)
          enabled=" $(tr ',' ' ' <<<"$DEPLOY_IMAGES") "
          matrix=$(jq -cs --arg enabled "$enabled" '
            map(. as $i | select($enabled | contains(" " + $i.name + " ")))
            | map(. + {overlay: "onprem/controllers/\(.name)/overlays/onprem"})' "${files[@]}" /dev/null)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(jq length <<<"$matrix")" >> "$GITHUB_OUTPUT"
          echo "### 배포 대상 (DEPLOY_IMAGES=${DEPLOY_IMAGES:-비어 있음})" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | "- \(.name) → \(.overlay)"' <<<"$matrix" >> "$GITHUB_STEP_SUMMARY"

  # 로직은 Gitops 재사용 워크플로 한 곳 (Frontend · Backend와 같음). 봇 push 충돌을 피하려고 하나씩.
  deploy:
    name: gitops deploy (${{ matrix.name }})
    needs: deploy-targets
    if: needs.deploy-targets.outputs.count > 0
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.deploy-targets.outputs.matrix) }}
    uses: DevOops-Team/Gitops/.github/workflows/update-image.yml@main
    with:
      image: ${{ matrix.image }}
      digest: ${{ matrix.digest }}
      overlay: ${{ matrix.overlay }}
      app-id: ${{ vars.DEPLOY_APP_ID }}
      gitops-repo: ${{ vars.GITOPS_REPO }}
    secrets:
      app-private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
