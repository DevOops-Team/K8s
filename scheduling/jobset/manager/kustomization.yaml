# 관리 클러스터용 JobSet: base + 3중화 (11/09). 워커 EKS는 base 그대로 (시스템 노드 수 미정)
# 설치: kubectl apply --server-side -k scheduling/jobset/manager
resources:
  - ../base
  - pdb.yaml
patches:
  # JobSet 웹훅도 failurePolicy Fail -> Pod 하나면 재시작 동안 JobSet 생성이 거부됨
  - target:
      kind: Deployment
      name: jobset-controller-manager
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: jobset-controller-manager
      spec:
        replicas: 3
        strategy:
          type: RollingUpdate
          rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
        template:
          spec:
            nodeSelector: {platform-worker: 'true'}
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector: {matchLabels: {app.kubernetes.io/name: jobset}}
                  topologyKey: kubernetes.io/hostname
