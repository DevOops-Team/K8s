apiVersion: batch/v1
kind: Job
metadata:
  generateName: disp-test-
  namespace: training
  labels:
    kueue.x-k8s.io/queue-name: queue-light
spec:
  suspend: true
  completions: 1
  parallelism: 1
  template:
    spec:
      restartPolicy: Never
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      containers:
      - name: main
        image: busybox:1.36
        command: ["sh", "-c", "echo start; sleep 600"]
        resources:
          limits:
            nvidia.com/gpu: "1"
