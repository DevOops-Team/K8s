# 실습 전용: GPU를 15분 동안 점유하는 테스트 잡 2개 (KWOK pod-complete 지연 어노테이션 사용)
apiVersion: batch/v1
kind: Job
metadata:
  name: hold-a
  namespace: ml
  labels:
    kueue.x-k8s.io/queue-name: lq-train
spec:
  suspend: true
  template:
    metadata:
      annotations:
        pod-complete.stage.kwok.x-k8s.io/delay: "15m"
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: busybox:1.36
        command: ["sleep", "900"]
        resources:
          requests: { nvidia.com/gpu: 1 }
          limits:   { nvidia.com/gpu: 1 }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: hold-b
  namespace: ml
  labels:
    kueue.x-k8s.io/queue-name: lq-train
spec:
  suspend: true
  template:
    metadata:
      annotations:
        pod-complete.stage.kwok.x-k8s.io/delay: "15m"
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: busybox:1.36
        command: ["sleep", "900"]
        resources:
          requests: { nvidia.com/gpu: 1 }
          limits:   { nvidia.com/gpu: 1 }
