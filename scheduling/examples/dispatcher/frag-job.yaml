# 실습 전용: 쿼터는 맞지만 단일 노드에 안 들어가는 잡 (GPU 1개 노드에 2 GPU Pod)
apiVersion: batch/v1
kind: Job
metadata:
  name: frag-2gpu
  namespace: training
  labels:
    kueue.x-k8s.io/queue-name: queue-light
spec:
  suspend: true
  template:
    metadata:
      annotations:
        pod-complete.stage.kwok.x-k8s.io/delay: "15m"
    spec:
      restartPolicy: Never
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      containers:
      - name: main
        image: busybox:1.36
        command: ["sleep", "900"]
        resources:
          requests: { nvidia.com/gpu: 2 }
          limits:   { nvidia.com/gpu: 2 }
