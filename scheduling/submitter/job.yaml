# 잡 투입기를 관리 클러스터 platform에서 실험 때만 Job으로 (K8s 아키텍처 11/05: 데이터·잡 투입기 -> platform)
# 코드·시나리오는 ConfigMap으로 넣는다:
#   kubectl -n platform create configmap submitter --from-file=submit.py --from-file=scenario.csv=<시나리오 파일>
#   kubectl -n platform apply -f job.yaml && kubectl -n platform logs -f job/submitter
# 백엔드 모드만 (표준 라이브러리만 씀). 결과 CSV는 로그 끝에 출력
apiVersion: batch/v1
kind: Job
metadata:
  name: submitter
  namespace: platform
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: submitter
        image: python:3.12-slim
        command: [sh, -c, "python /app/submit.py /app/scenario.csv --out /tmp/results.csv && cat /tmp/results.csv"]
        env:
        - {name: BACKEND_URL, value: "http://backend.platform.svc:8000"}
        - {name: MODEL, value: gpt2}
        - {name: DATASET_ID, value: ds-demo}
        - {name: PYTHONUNBUFFERED, value: "1"}
        volumeMounts:
        - {name: app, mountPath: /app, readOnly: true}
        resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 128Mi}}
      volumes:
      - name: app
        configMap: {name: submitter}
