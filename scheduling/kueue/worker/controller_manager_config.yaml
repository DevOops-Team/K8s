apiVersion: config.kueue.x-k8s.io/v1beta2
# Kueue가 도는 네임스페이스 (기본 kueue-system). 웹훅 인증서 이름·MultiKueue kubeconfig Secret 위치도 여기
namespace: platform
clientConnection:
  burst: 500
  qps: 300
controller:
  groupKindConcurrency:
    ClusterQueue.kueue.x-k8s.io: 5
    Cohort.kueue.x-k8s.io: 1
    Job.batch: 5
    LocalQueue.kueue.x-k8s.io: 5
    Pod: 5
    ResourceFlavor.kueue.x-k8s.io: 1
    Workload.kueue.x-k8s.io: 10
health:
  healthProbeBindAddress: :8081
integrations:
  frameworks:
  - batch/job
  - jobset.x-k8s.io/jobset
internalCertManagement:
  enable: true
  webhookSecretName: kueue-webhook-server-cert
  webhookServiceName: kueue-webhook-service
kind: Configuration
leaderElection:
  leaderElect: true
  resourceName: c1f6bfd2.kueue.x-k8s.io
metrics:
  bindAddress: :8443
webhook:
  port: 9443
# 갱 스케줄링(전부 아니면 전무): 승인 후 timeout 안에 Pod 전부 Ready가 안 되면 통째로 내림
# timeout 2m은 kind 테스트용. EKS에서는 이미지 pull 시간을 감안해 eks 오버레이에서 따로 정함
waitForPodsReady:
  timeout: 2m
  blockAdmission: true
  # 실행 중 Pod가 죽었을 때 Kueue가 혼자 내리고 다시 넣지 않게 끔.
  # 실행 중 장애의 재시작 여부는 장애복구 파트가 판단하고 재배치 요청으로만 처리 (세대 번호 없이 재시작되는 것 방지)
  recoveryTimeout: 0s
  # 처음 입장할 때의 갱 실패(timeout)도 Kueue가 다시 큐에 넣지 않음 -> Workload 비활성화
  # 재시작 주체는 복구 컨트롤러 하나 (JobSet 템플릿 5절, 11/05 확정). 감시기가 job.failed를 내고 복구 컨트롤러가 처리
  requeuingStrategy:
    backoffLimitCount: 0
