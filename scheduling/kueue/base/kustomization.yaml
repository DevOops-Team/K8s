# Kueue v0.20.4 기본 매니페스트를 platform 네임스페이스로 옮겨 설치 (11/05 K8s 아키텍처)
namespace: platform
resources:
  - namespace.yaml
  - kueue-v0.20.4-manifests.yaml
patches:
  # 기본 매니페스트의 kueue-system Namespace는 안 만듦 (platform은 namespace.yaml)
  - target:
      kind: Namespace
      name: kueue-system
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: kueue-system
  # CPU requests 500m -> 250m (관리 worker 1대 장애 시 CPU 여유 확보, EKS 시스템 노드 공간 확보)
  # limits(cpu 2, memory 512Mi)와 memory requests는 기본값 유지
  - target:
      kind: Deployment
      name: kueue-controller-manager
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kueue-controller-manager
      spec:
        template:
          spec:
            containers:
              - name: manager
                resources:
                  requests:
                    cpu: 250m
replacements:
  # 웹훅은 kube-system·kueue-system을 제외하게 하드코딩돼 있음 -> 두 번째 값을 platform으로.
  # 안 바꾸면 failurePolicy Fail인 Kueue Pod 웹훅이 자기 네임스페이스(platform)의 Pod 생성까지 막을 수 있음
  - source:
      kind: Namespace
      name: platform
      fieldPath: metadata.name
    targets:
      - select:
          kind: MutatingWebhookConfiguration
          name: kueue-mutating-webhook-configuration
        fieldPaths:
          - webhooks.*.namespaceSelector.matchExpressions.[key=kubernetes.io/metadata.name].values.1
      - select:
          kind: ValidatingWebhookConfiguration
          name: kueue-validating-webhook-configuration
        fieldPaths:
          - webhooks.*.namespaceSelector.matchExpressions.[key=kubernetes.io/metadata.name].values.1
