# Kueue v0.20.4 기본 매니페스트 (kueue-system 그대로, 11/10 정본: Kueue는 kueue-system)
# 바꾸는 것은 CPU requests 하나. 네임스페이스를 옮기지 않으므로 웹훅 제외 목록·kube-system RoleBinding 땜질이 필요 없다
resources:
  - kueue-v0.20.4-manifests.yaml
patches:
  # CPU requests 500m -> 250m (관리 worker 1대 장애 시 CPU 여유 확보, EKS 시스템 노드 공간 확보)
  # limits(cpu 2, memory 512Mi)와 memory requests는 기본값 유지
  - target:
      kind: Deployment
      name: kueue-controller-manager
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kueue-controller-manager
      spec:
        template:
          spec:
            containers:
              - name: manager
                resources:
                  requests:
                    cpu: 250m
