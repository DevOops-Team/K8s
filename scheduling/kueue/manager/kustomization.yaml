resources:
  - ../base
  - kueue-v0.20.4-workload-map.yaml
configMapGenerator:
  - name: kueue-manager-config
    namespace: platform
    behavior: replace
    files:
      - controller_manager_config.yaml
generatorOptions:
  disableNameSuffixHash: true
patches:
  # 1.35에는 MAP v1이 없음 (1.36 GA). v1beta1로 내려서 적용
  - target:
      group: admissionregistration.k8s.io
      version: v1
      kind: MutatingAdmissionPolicy
    patch: |-
      - op: replace
        path: /apiVersion
        value: admissionregistration.k8s.io/v1beta1
  - target:
      group: admissionregistration.k8s.io
      version: v1
      kind: MutatingAdmissionPolicyBinding
    patch: |-
      - op: replace
        path: /apiVersion
        value: admissionregistration.k8s.io/v1beta1
