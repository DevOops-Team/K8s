    kwok.x-k8s.io/node: fake
  labels:
    type: kwok
    node-role.devoops.site/gpu: "true"
    kubernetes.io/hostname: gpu-node-1

spec:
  taints:
    - key: kwok.x-k8s.io/node
      value: fake
      effect: NoSchedule
    - key: nvidia.com/gpu
      value: present
      effect: NoSchedule
status:
  capacity:    {cpu: "4", memory: 16Gi, pods: "110", nvidia.com/gpu: "1"}
  allocatable: {cpu: "4", memory: 16Gi, pods: "110", nvidia.com/gpu: "1"}
