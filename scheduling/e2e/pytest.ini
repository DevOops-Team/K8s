[pytest]
testpaths = tests/normal tests/compare
addopts = -p no:cacheprovider -ra --tb=short
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(message)s
log_cli_date_format = %H:%M:%S
markers =
    normal: 평소 학습 규칙 검사 (PASS/FAIL 판정)
    compare: 한 가지만 바꿔 두 번 돌리는 비교 실험 (가설에 대한 판정)
    controllers(*names, **env): 이 케이스가 쓸 컨트롤러와 환경 값. 없으면 셋 다 기본값
    any_controllers: 컨트롤러가 떠 있든 말든 상관없음 (클러스터 상태만 읽는 케이스)
    doc(ref): 설계 문서 위치
