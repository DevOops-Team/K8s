resources:
  - ../../base
patches:
  # kind 전용: GPU가 KWOK 가짜 노드에만 있으므로 그 노드로 가도록 flavor에서 주입
  # (nvidia.com/gpu taint toleration은 JobSet 템플릿에 있음. 여기선 KWOK taint만)
  - target:
      kind: ResourceFlavor
      name: gpu
    patch: |-
      apiVersion: kueue.x-k8s.io/v1beta2
      kind: ResourceFlavor
      metadata:
        name: gpu
      spec:
        nodeLabels:
          node-role.devoops.site/gpu: "true"
        tolerations:
        - key: kwok.x-k8s.io/node
          operator: Equal
          value: fake
          effect: NoSchedule
