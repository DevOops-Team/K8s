# 워커 큐: GPU 노드 5대 = 학습 4 + 예비(복구 전용) 1
# 빌려주기는 한 방향만: 학습 몫은 복구 잡에 빌려줄 수 있고, 복구 몫은 학습 잡에 안 빌려줌
apiVersion: v1
kind: Namespace
metadata:
  name: training
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: gpu
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: train-cq
spec:
  cohortName: training
  namespaceSelector: {}
  resourceGroups:
  - coveredResources: ["nvidia.com/gpu"]
    flavors:
    - name: gpu
      resources:
      - name: nvidia.com/gpu
        nominalQuota: "4"   # 학습용 노드 수. 우리 망에서는 overlay에서 바꿈
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: recovery-cq
spec:
  cohortName: training
  namespaceSelector:   # 복구 몫은 학습 잡 네임스페이스에서만
    matchLabels: {kubernetes.io/metadata.name: training}
  resourceGroups:
  - coveredResources: ["nvidia.com/gpu"]
    flavors:
    - name: gpu
      resources:
      - name: nvidia.com/gpu
        nominalQuota: "1"   # 예비 노드 수
        lendingLimit: "0"   # 복구 몫은 학습 잡에 안 빌려줌
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: queue-heavy
  namespace: training
spec:
  clusterQueue: train-cq  # 워커는 학습 CQ 하나. 관리 클러스터와 같은 LQ 이름만 맞춤
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: queue-light
  namespace: training
spec:
  clusterQueue: train-cq
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: queue-recovery
  namespace: training
spec:
  clusterQueue: recovery-cq
