---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: cq-heavy
spec:
  admissionChecksStrategy:
    admissionChecks:
    - name: multikueue-ac
  cohortName: training
  flavorFungibility:
    whenCanBorrow: MayStopSearch
    whenCanPreempt: TryNextFlavor
  namespaceSelector: {}
  preemption:
    borrowWithinCohort:
      policy: Never
    reclaimWithinCohort: Never
    withinClusterQueue: Never
  queueingStrategy: StrictFIFO   # Heavy끼리는 순서 보장 (앞의 큰 잡이 못 들어가면 뒤도 대기)
  resourceGroups:
  - coveredResources:
    - nvidia.com/gpu
    flavors:
    - name: gpu
      resources:
      - name: nvidia.com/gpu
        nominalQuota: '8'   # 학습 12 = heavy 8 + light 4 (워커 학습 4 x 3). GPU 3장 이상 잡
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: cq-light
spec:
  admissionChecksStrategy:
    admissionChecks:
    - name: multikueue-ac
  cohortName: training
  flavorFungibility:
    whenCanBorrow: MayStopSearch
    whenCanPreempt: TryNextFlavor
  namespaceSelector: {}
  preemption:
    borrowWithinCohort:
      policy: Never
    reclaimWithinCohort: Never
    withinClusterQueue: Never
  queueingStrategy: BestEffortFIFO   # 작은 잡은 들어갈 수 있는 것부터
  resourceGroups:
  - coveredResources:
    - nvidia.com/gpu
    flavors:
    - name: gpu
      resources:
      - name: nvidia.com/gpu
        nominalQuota: '4'   # GPU 2장 이하 잡
        # borrowingLimit 없음 = Heavy가 비면 남는 몫 전부 빌려 씀.
        # Heavy 잡이 자기 몫 안에서 기다리는 동안엔 Kueue가 새 빌려 쓰기를 막는다(KEP-83) -> 따로 조일 필요 없음
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: cq-recovery
spec:
  admissionChecksStrategy:
    admissionChecks:
    - name: multikueue-ac
  cohortName: training
  flavorFungibility:
    whenCanBorrow: MayStopSearch
    whenCanPreempt: TryNextFlavor
  namespaceSelector:   # 복구 몫은 학습 잡 네임스페이스에서만 (다른 네임스페이스 LocalQueue가 붙어도 못 씀)
    matchLabels: {kubernetes.io/metadata.name: training}
  preemption:
    borrowWithinCohort:
      policy: Never
    reclaimWithinCohort: Never
    withinClusterQueue: Never
  queueingStrategy: BestEffortFIFO
  resourceGroups:
  - coveredResources:
    - nvidia.com/gpu
    flavors:
    - name: gpu
      resources:
      - name: nvidia.com/gpu
        nominalQuota: '3'   # 예비 1 x 3
        # 복구 몫은 학습 잡에 안 빌려줌 (학습 몫은 복구 잡에 빌려줌)
        lendingLimit: '0'
