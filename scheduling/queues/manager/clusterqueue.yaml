---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: cq-heavy
spec:
  admissionChecksStrategy:
    admissionChecks:
    - name: multikueue-ac
  cohortName: training
  flavorFungibility:
    whenCanBorrow: MayStopSearch
    whenCanPreempt: TryNextFlavor
  namespaceSelector: {}
  preemption:
    borrowWithinCohort:
      policy: Never
    reclaimWithinCohort: Never
    withinClusterQueue: Never
  queueingStrategy: BestEffortFIFO
  resourceGroups:
  - coveredResources:
    - nvidia.com/gpu
    flavors:
    - name: gpu
      resources:
      - name: nvidia.com/gpu
        nominalQuota: '8'
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: cq-light
spec:
  admissionChecksStrategy:
    admissionChecks:
    - name: multikueue-ac
  cohortName: training
  flavorFungibility:
    whenCanBorrow: MayStopSearch
    whenCanPreempt: TryNextFlavor
  namespaceSelector: {}
  preemption:
    borrowWithinCohort:
      policy: Never
    reclaimWithinCohort: Never
    withinClusterQueue: Never
  queueingStrategy: BestEffortFIFO
  resourceGroups:
  - coveredResources:
    - nvidia.com/gpu
    flavors:
    - name: gpu
      resources:
      - name: nvidia.com/gpu
        nominalQuota: '2'
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: cq-recovery
spec:
  admissionChecksStrategy:
    admissionChecks:
    - name: multikueue-ac
  cohortName: training
  flavorFungibility:
    whenCanBorrow: MayStopSearch
    whenCanPreempt: TryNextFlavor
  namespaceSelector: {}
  preemption:
    borrowWithinCohort:
      policy: Never
    reclaimWithinCohort: Never
    withinClusterQueue: Never
  queueingStrategy: BestEffortFIFO
  resourceGroups:
  - coveredResources:
    - nvidia.com/gpu
    flavors:
    - name: gpu
      resources:
      - name: nvidia.com/gpu
        nominalQuota: '2'
        # 복구 몫은 남에게 빌려주지 않음: 선점 없이도 복구 잡이 바로 쿼터를 받게
        lendingLimit: '0'
