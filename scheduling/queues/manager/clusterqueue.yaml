---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: cq-heavy
spec:
  admissionChecksStrategy:
    admissionChecks:
    - name: multikueue-ac
  cohortName: training
  flavorFungibility:
    whenCanBorrow: MayStopSearch
    whenCanPreempt: TryNextFlavor
  namespaceSelector: {}
  preemption:
    borrowWithinCohort:
      policy: Never
    reclaimWithinCohort: Never
    withinClusterQueue: Never
  queueingStrategy: BestEffortFIFO
  resourceGroups:
  - coveredResources:
    - nvidia.com/gpu
    flavors:
    - name: gpu
      resources:
      - name: nvidia.com/gpu
        nominalQuota: '10'   # 학습 12 = heavy 10 + light 2 (워커 학습 4 x 3)
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: cq-light
spec:
  admissionChecksStrategy:
    admissionChecks:
    - name: multikueue-ac
  cohortName: training
  flavorFungibility:
    whenCanBorrow: MayStopSearch
    whenCanPreempt: TryNextFlavor
  namespaceSelector: {}
  preemption:
    borrowWithinCohort:
      policy: Never
    reclaimWithinCohort: Never
    withinClusterQueue: Never
  queueingStrategy: BestEffortFIFO
  resourceGroups:
  - coveredResources:
    - nvidia.com/gpu
    flavors:
    - name: gpu
      resources:
      - name: nvidia.com/gpu
        nominalQuota: '2'
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: cq-recovery
spec:
  admissionChecksStrategy:
    admissionChecks:
    - name: multikueue-ac
  cohortName: training
  flavorFungibility:
    whenCanBorrow: MayStopSearch
    whenCanPreempt: TryNextFlavor
  namespaceSelector: {}
  preemption:
    borrowWithinCohort:
      policy: Never
    reclaimWithinCohort: Never
    withinClusterQueue: Never
  queueingStrategy: BestEffortFIFO
  resourceGroups:
  - coveredResources:
    - nvidia.com/gpu
    flavors:
    - name: gpu
      resources:
      - name: nvidia.com/gpu
        nominalQuota: '3'   # 예비 1 x 3
        # 복구 몫은 학습 잡에 안 빌려줌 (학습 몫은 복구 잡에 빌려줌)
        lendingLimit: '0'
