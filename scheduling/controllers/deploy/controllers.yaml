# 관리 클러스터에 올리는 컨트롤러 3개. 네임스페이스 job-placement (11/04 확정)
# 지금은 레플리카 1, 리더 선출 없음 -> HA(레플리카 2 + 리더 선출 + PDB)는 다음 단계
apiVersion: v1
kind: Namespace
metadata:
  name: job-placement
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-placement
  namespace: job-placement
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: job-placement
rules:
- apiGroups: [kueue.x-k8s.io]
  resources: [workloads, multikueueclusters, clusterqueues]
  verbs: [get, list, watch, patch]
- apiGroups: [kueue.x-k8s.io]
  resources: [workloads/status]
  verbs: [patch]
- apiGroups: [jobset.x-k8s.io]
  resources: [jobsets]
  verbs: [get, list, watch, create, patch, delete]
- apiGroups: [batch]
  resources: [jobs]
  verbs: [get, list]
- apiGroups: [scheduling.devoops.site]
  resources: [relocationrequests]
  verbs: [get, list, watch]
- apiGroups: [scheduling.devoops.site]
  resources: [relocationrequests/status]
  verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: job-placement
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: job-placement}
subjects:
- {kind: ServiceAccount, name: job-placement, namespace: job-placement}
---
# 워커 kubeconfig: MultiKueue가 쓰는 Secret을 같이 읽는다 (워커 쪽 권한은 그 kubeconfig 계정 권한)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-placement-worker-kubeconfig
  namespace: kueue-system
rules:
- apiGroups: [""]
  resources: [secrets]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-placement-worker-kubeconfig
  namespace: kueue-system
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: job-placement-worker-kubeconfig}
subjects:
- {kind: ServiceAccount, name: job-placement, namespace: job-placement}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcher
  namespace: job-placement
spec:
  replicas: 1
  selector: {matchLabels: {app: dispatcher}}
  template:
    metadata: {labels: {app: dispatcher}}
    spec:
      serviceAccountName: job-placement
      containers:
      - name: main
        image: job-placement:dev
        imagePullPolicy: IfNotPresent
        command: ["python", "dispatcher.py"]
        resources: {requests: {cpu: 50m, memory: 64Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relocator
  namespace: job-placement
spec:
  replicas: 1
  selector: {matchLabels: {app: relocator}}
  template:
    metadata: {labels: {app: relocator}}
    spec:
      serviceAccountName: job-placement
      containers:
      - name: main
        image: job-placement:dev
        imagePullPolicy: IfNotPresent
        command: ["python", "relocator.py"]
        resources: {requests: {cpu: 50m, memory: 64Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: priority
  namespace: job-placement
spec:
  replicas: 1
  selector: {matchLabels: {app: priority}}
  template:
    metadata: {labels: {app: priority}}
    spec:
      serviceAccountName: job-placement
      containers:
      - name: main
        image: job-placement:dev
        imagePullPolicy: IfNotPresent
        command: ["python", "priority.py"]
        resources: {requests: {cpu: 50m, memory: 64Mi}}
