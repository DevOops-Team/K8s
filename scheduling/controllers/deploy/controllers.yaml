# 관리 클러스터에 올리는 컨트롤러 3개. 네임스페이스 job-placement (11/04 확정)
# HA: 컨트롤러마다 레플리카 3개를 platform-worker=true 노드(worker1~3)에 하나씩.
#     Lease(job-placement-<이름>)로 리더 하나만 일하고 나머지 둘은 대기 (leader.py)
#     노드 하나가 죽어도 남은 둘 중 하나가 LEASE_SECONDS(15s) 안에 이어받음
apiVersion: v1
kind: Namespace
metadata:
  name: job-placement
---
# 컨트롤러마다 ServiceAccount를 따로 둔다: 필요한 권한만
#   dispatcher: Workload 지명 + 워커 kubeconfig 읽기
#   relocator : JobSet 삭제·생성 + 펜싱 라벨 + 워커 kubeconfig 읽기 + 잡 사본 ConfigMap
#   allocator : JobSet 우선순위 라벨 (배분 조정 컨트롤러)
apiVersion: v1
kind: ServiceAccount
metadata: {name: dispatcher, namespace: job-placement}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: relocator, namespace: job-placement}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: allocator, namespace: job-placement}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: job-placement-dispatcher}
rules:
- apiGroups: [kueue.x-k8s.io]
  resources: [workloads]
  verbs: [get, list, watch, patch]
- apiGroups: [kueue.x-k8s.io]
  resources: [workloads/status]
  verbs: [patch]
- apiGroups: [kueue.x-k8s.io]
  resources: [multikueueclusters]
  verbs: [get, list, watch]
- apiGroups: [jobset.x-k8s.io]
  resources: [jobsets]
  verbs: [get]
- apiGroups: [batch]
  resources: [jobs]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: job-placement-relocator}
rules:
- apiGroups: [kueue.x-k8s.io]
  resources: [workloads]
  verbs: [get, list, watch]
- apiGroups: [kueue.x-k8s.io]
  resources: [multikueueclusters]
  verbs: [get, list, watch, patch]
- apiGroups: [jobset.x-k8s.io]
  resources: [jobsets]
  verbs: [get, list, create, delete]
- apiGroups: [scheduling.devoops.site]
  resources: [relocationrequests]
  verbs: [get, list, watch]
- apiGroups: [scheduling.devoops.site]
  resources: [relocationrequests/status]
  verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: job-placement-allocator}
rules:
- apiGroups: [kueue.x-k8s.io]
  resources: [workloads]
  verbs: [get, list, watch]
- apiGroups: [jobset.x-k8s.io]
  resources: [jobsets]
  verbs: [get, list, watch, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: job-placement-dispatcher}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: job-placement-dispatcher}
subjects: [{kind: ServiceAccount, name: dispatcher, namespace: job-placement}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: job-placement-relocator}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: job-placement-relocator}
subjects: [{kind: ServiceAccount, name: relocator, namespace: job-placement}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: job-placement-allocator}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: job-placement-allocator}
subjects: [{kind: ServiceAccount, name: allocator, namespace: job-placement}]
---
# 워커 kubeconfig: MultiKueue가 쓰는 Secret 중 이름을 지정한 것만 (우리 망에서는 eks-a/b/c-kubeconfig로 바꿈)
# MultiKueueCluster 목록 조회도 필요하지만 그건 위 ClusterRole에 있음
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: job-placement-worker-kubeconfig, namespace: kueue-system}
rules:
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [worker1-secret, worker2-secret, worker3-secret]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: job-placement-worker-kubeconfig, namespace: kueue-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: job-placement-worker-kubeconfig}
subjects:
- {kind: ServiceAccount, name: dispatcher, namespace: job-placement}
- {kind: ServiceAccount, name: relocator, namespace: job-placement}
---
# 재배치 실행기의 잡 사본 보관소 (자기 네임스페이스 ConfigMap만)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: relocator-snapshots, namespace: job-placement}
rules:
- apiGroups: [""]
  resources: [configmaps]
  verbs: [get, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: relocator-snapshots, namespace: job-placement}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: relocator-snapshots}
subjects: [{kind: ServiceAccount, name: relocator, namespace: job-placement}]
---
# 리더 선출 Lease (자기 네임스페이스, 컨트롤러별 이름)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: job-placement-leader-election, namespace: job-placement}
rules:
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: job-placement-leader-election, namespace: job-placement}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: job-placement-leader-election}
subjects:
- {kind: ServiceAccount, name: dispatcher, namespace: job-placement}
- {kind: ServiceAccount, name: relocator, namespace: job-placement}
- {kind: ServiceAccount, name: allocator, namespace: job-placement}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcher
  namespace: job-placement
spec:
  replicas: 3
  strategy:                      # 노드 3대에 하나씩이라 하나 내리고 하나 올림 (maxSurge 0)
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector: {matchLabels: {app: dispatcher}}
  template:
    metadata: {labels: {app: dispatcher}}
    spec:
      serviceAccountName: dispatcher
      nodeSelector: {platform-worker: 'true'}
      affinity:
        podAntiAffinity:         # 같은 노드에 둘 안 올림 -> worker1/2/3에 하나씩
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector: {matchLabels: {app: dispatcher}}
            topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 10
      containers:
      - name: main
        image: job-placement:dev
        imagePullPolicy: IfNotPresent
        command: ["python", "dispatcher.py"]
        env:
        - name: POD_NAME         # Lease holderIdentity
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        resources: {requests: {cpu: 50m, memory: 64Mi}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: dispatcher, namespace: job-placement}
spec:
  maxUnavailable: 1              # 노드 drain 때도 둘은 남김
  selector: {matchLabels: {app: dispatcher}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relocator
  namespace: job-placement
spec:
  replicas: 3
  strategy:                      # 노드 3대에 하나씩이라 하나 내리고 하나 올림 (maxSurge 0)
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector: {matchLabels: {app: relocator}}
  template:
    metadata: {labels: {app: relocator}}
    spec:
      serviceAccountName: relocator
      nodeSelector: {platform-worker: 'true'}
      affinity:
        podAntiAffinity:         # 같은 노드에 둘 안 올림 -> worker1/2/3에 하나씩
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector: {matchLabels: {app: relocator}}
            topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 10
      containers:
      - name: main
        image: job-placement:dev
        imagePullPolicy: IfNotPresent
        command: ["python", "relocator.py"]
        env:
        - name: POD_NAME         # Lease holderIdentity
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        resources: {requests: {cpu: 50m, memory: 64Mi}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: relocator, namespace: job-placement}
spec:
  maxUnavailable: 1              # 노드 drain 때도 둘은 남김
  selector: {matchLabels: {app: relocator}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: allocator
  namespace: job-placement
spec:
  replicas: 3
  strategy:                      # 노드 3대에 하나씩이라 하나 내리고 하나 올림 (maxSurge 0)
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector: {matchLabels: {app: allocator}}
  template:
    metadata: {labels: {app: allocator}}
    spec:
      serviceAccountName: allocator
      nodeSelector: {platform-worker: 'true'}
      affinity:
        podAntiAffinity:         # 같은 노드에 둘 안 올림 -> worker1/2/3에 하나씩
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector: {matchLabels: {app: allocator}}
            topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 10
      containers:
      - name: main
        image: job-placement:dev
        imagePullPolicy: IfNotPresent
        command: ["python", "allocator.py"]
        env:
        - name: POD_NAME         # Lease holderIdentity
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        resources: {requests: {cpu: 50m, memory: 64Mi}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: allocator, namespace: job-placement}
spec:
  maxUnavailable: 1              # 노드 drain 때도 둘은 남김
  selector: {matchLabels: {app: allocator}}
