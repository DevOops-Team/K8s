# 재배치 요청: 장애복구 파트(복구 컨트롤러)가 DynamoDB 세대 +1(GENERATION_ADVANCED)을 한 뒤 만들고 재배치 실행기가 처리한다.
# 정책 이름(ours / naive / hyperpod)은 모른다. "무엇을 할지(action)"만 받는다.
# 요청은 학습 잡과 같은 training 네임스페이스에 둔다 (11/05 K8s 아키텍처). 장애복구 파트와 최종 확인 필요
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: relocationrequests.scheduling.devoops.site
spec:
  group: scheduling.devoops.site
  scope: Namespaced
  names:
    kind: RelocationRequest
    plural: relocationrequests
    singular: relocationrequest
    shortNames: [rr]
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - {name: Request, type: string, jsonPath: .spec.requestId}
    - {name: Action, type: string, jsonPath: .spec.action}
    - {name: Job, type: string, jsonPath: .spec.jobRef}
    - {name: Phase, type: string, jsonPath: .status.phase}
    - {name: From, type: string, jsonPath: .status.sourceCluster}
    - {name: To, type: string, jsonPath: .status.targetCluster}
    - {name: NewJob, type: string, jsonPath: .status.newJob}
    - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [requestId, jobRef, action]
            x-kubernetes-validations:
            - rule: "self == oldSelf"
              message: "spec은 만든 뒤 바꿀 수 없음. 새 요청을 만들 것"
            - rule: "self.action != 'moveToSpare' || (has(self.excludeNodes) && size(self.excludeNodes) > 0)"
              message: "moveToSpare에는 excludeNodes가 필요"
            properties:
              requestId:
                type: string
                description: 펜싱 기록(DynamoDB)의 recovery_id와 같은 값. 같은 값의 요청은 한 번만 실행
              jobRef:
                type: string
                description: 지금 세대 JobSet, namespace/job-{작업ID}-g{세대 4자리} (관리 클러스터 기준)
                pattern: '^[a-z0-9-]+/[a-z0-9.-]+$'
              action:
                type: string
                enum: [restartInPlace, moveToSpare, moveToOtherCluster, evacuateCluster]
              excludeNodes:
                type: array
                items: {type: string}
                description: 격리할 노드 (moveToSpare 필수, moveToOtherCluster 선택)
              excludeClusters:
                type: array
                items: {type: string}
                description: 재제출 때 보내면 안 되는 클러스터
              reason:
                type: string
                description: 기록용 원인 분류
                enum: [hardware, software, spot, straggler, sdc, az, unknown]
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
            properties:
              phase:
                type: string
                description: "(Pending = 세대 +1 대기) -> Accepted -> Executing (-> WaitingForStop -> Held) (-> AdmitDelayed) -> Done / Failed / Duplicate"
              message: {type: string}
              sourceCluster: {type: string}
              targetCluster: {type: string}
              newJob: {type: string}
              acceptedAt: {type: string}
              isolatedAt: {type: string}
              stoppedAt: {type: string}
              resubmittedAt: {type: string}
              admittedAt: {type: string}
              jobId: {type: string}
              fromGeneration: {type: integer}
              toGeneration: {type: integer}
              oldExclude: {type: string}
              gpus: {type: integer, description: 옛 잡의 GPU 수 (기록용)}
              seenClusters:
                type: array
                items: {type: string}
                description: 옛 잡 복사본이 있을 수 있는 워커 (입장 + 지명). 종료 확인은 여기 전부를 본다
