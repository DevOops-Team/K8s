# 관리 클러스터 입장 정책 (ValidatingAdmissionPolicy, K8s 1.30+ GA. 우리는 1.35)
# RBAC만으로는 못 막는 것 5가지를 API 서버에서 거절한다 (보안 검토 11/09, 4·5번은 11/10 추가):
#   1. RelocationRequest 만들기·고치기 = 복구 컨트롤러만
#      (요청 하나로 노드 cordon·클러스터 펜싱·잡 삭제가 일어남)
#   2. RelocationRequest status 쓰기 = 재배치 실행기만
#      (실행기가 status의 sourceCluster로 옛 실행이 멈췄는지 확인함)
#   3. 복구 큐·복구 우선순위를 새로 다는 것 = 재배치 실행기만
#      (아무 잡이나 queue-recovery·recovery를 달면 예비 GPU를 차지함)
#   4. 디스패처가 읽는 어노테이션(target-cluster·exclude-clusters·manual-dispatch)을 붙이기·바꾸기·떼기 = 재배치 실행기만
#      (manual-dispatch=true면 쿼터만 쥐고 배치가 안 됨, target이면 클러스터를 골라 감, exclude를 떼면 피해야 할 클러스터로 감)
#   5. 예비 노드 taint(devoops/spare)를 견디는 toleration = 복구 큐 잡만
#      (학습 잡이 달면 예비 노드를 차지함. 정본 I4. 키 없는 operator: Exists도 모든 taint를 견디므로 같이 막음)
# 1~4는 클러스터 관리자(kind·Kubespray kubeadm 관리자 kubeconfig)는 통과: 시나리오·run-local.sh·손 복구용
# ServiceAccount 이름이 바뀌면 여기와 controllers.yaml을 같이 고칠 것
#   복구 컨트롤러: platform/recovery-controller (onprem/apps/recovery-controller)
#   재배치 실행기: platform/relocator
#   JobSet 컨트롤러: jobset-system/jobset-controller-manager (자식 Job을 만듦)
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: scheduling-relocation-request-writers}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [scheduling.devoops.site]
      apiVersions: ["*"]
      operations: [CREATE, UPDATE]
      resources: [relocationrequests]
  variables:
  - name: admin
    expression: "request.userInfo.groups.exists(g, g == 'system:masters' || g == 'kubeadm:cluster-admins')"
  validations:
  - expression: "variables.admin || request.userInfo.username == 'system:serviceaccount:platform:recovery-controller'"
    messageExpression: "'RelocationRequest는 복구 컨트롤러(platform/recovery-controller)만 만들 수 있음: ' + request.userInfo.username"
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: scheduling-relocation-request-writers}
spec:
  policyName: scheduling-relocation-request-writers
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: scheduling-relocation-request-status}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [scheduling.devoops.site]
      apiVersions: ["*"]
      operations: [UPDATE]
      resources: [relocationrequests/status]
  variables:
  - name: admin
    expression: "request.userInfo.groups.exists(g, g == 'system:masters' || g == 'kubeadm:cluster-admins')"
  validations:
  - expression: "variables.admin || request.userInfo.username == 'system:serviceaccount:platform:relocator'"
    messageExpression: "'RelocationRequest status는 재배치 실행기(platform/relocator)만 쓸 수 있음: ' + request.userInfo.username"
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: scheduling-relocation-request-status}
spec:
  policyName: scheduling-relocation-request-status
  validationActions: [Deny]
---
# 복구 표시(queue-recovery 큐 또는 recovery 우선순위)가 "새로" 붙는 경우만 본다.
# 이미 붙어 있던 잡의 수정(Kueue suspend 토글, 배분 조정 컨트롤러의 우선순위 맞추기)은 그대로 통과
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: scheduling-recovery-queue}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [jobset.x-k8s.io]
      apiVersions: ["*"]
      operations: [CREATE, UPDATE]
      resources: [jobsets]
    - apiGroups: [batch]
      apiVersions: ["*"]
      operations: [CREATE, UPDATE]
      resources: [jobs]
  variables:
  - name: marked
    expression: >-
      has(object.metadata.labels) && (
        ('kueue.x-k8s.io/queue-name' in object.metadata.labels
          && object.metadata.labels['kueue.x-k8s.io/queue-name'] == 'queue-recovery') ||
        ('kueue.x-k8s.io/priority-class' in object.metadata.labels
          && object.metadata.labels['kueue.x-k8s.io/priority-class'] == 'recovery'))
  - name: wasMarked
    expression: >-
      oldObject != null && has(oldObject.metadata.labels) && (
        ('kueue.x-k8s.io/queue-name' in oldObject.metadata.labels
          && oldObject.metadata.labels['kueue.x-k8s.io/queue-name'] == 'queue-recovery') ||
        ('kueue.x-k8s.io/priority-class' in oldObject.metadata.labels
          && oldObject.metadata.labels['kueue.x-k8s.io/priority-class'] == 'recovery'))
  - name: allowed
    expression: >-
      request.userInfo.groups.exists(g, g == 'system:masters' || g == 'kubeadm:cluster-admins') ||
      request.userInfo.username in ['system:serviceaccount:platform:relocator',
                                    'system:serviceaccount:jobset-system:jobset-controller-manager']
  validations:
  - expression: "!variables.marked || variables.wasMarked || variables.allowed"
    messageExpression: "'queue-recovery 큐·recovery 우선순위는 재배치 실행기(platform/relocator)만 붙일 수 있음: ' + request.userInfo.username"
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: scheduling-recovery-queue}
spec:
  policyName: scheduling-recovery-queue
  validationActions: [Deny]
---
# 디스패처가 읽는 어노테이션의 값이 달라지는 경우만 본다 (새로 붙임·값 바꿈·뗌). 그대로인 수정은 통과.
# 백엔드가 최초 제출 때 이 어노테이션을 붙여야 하게 되면 allowed에 백엔드 ServiceAccount를 넣을 것
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: scheduling-dispatch-annotations}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [jobset.x-k8s.io]
      apiVersions: ["*"]
      operations: [CREATE, UPDATE]
      resources: [jobsets]
    - apiGroups: [batch]
      apiVersions: ["*"]
      operations: [CREATE, UPDATE]
      resources: [jobs]
  variables:
  - name: keys
    expression: "['devoops/target-cluster', 'devoops/exclude-clusters', 'devoops/manual-dispatch']"
  - name: changed
    expression: >-
      variables.keys.exists(k,
        (has(object.metadata.annotations) && k in object.metadata.annotations)
          != (oldObject != null && has(oldObject.metadata.annotations) && k in oldObject.metadata.annotations)
        || (has(object.metadata.annotations) && k in object.metadata.annotations
            && oldObject != null && has(oldObject.metadata.annotations) && k in oldObject.metadata.annotations
            && object.metadata.annotations[k] != oldObject.metadata.annotations[k]))
  - name: allowed
    expression: >-
      request.userInfo.groups.exists(g, g == 'system:masters' || g == 'kubeadm:cluster-admins') ||
      request.userInfo.username in ['system:serviceaccount:platform:relocator',
                                    'system:serviceaccount:jobset-system:jobset-controller-manager']
  validations:
  - expression: "!variables.changed || variables.allowed"
    messageExpression: "'devoops/target-cluster·exclude-clusters·manual-dispatch는 재배치 실행기(platform/relocator)만 붙이거나 바꿀 수 있음: ' + request.userInfo.username"
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: scheduling-dispatch-annotations}
spec:
  policyName: scheduling-dispatch-annotations
  validationActions: [Deny]
---
# 예비 노드 toleration은 복구 큐(queue-recovery) 잡에만. queue-recovery는 위 정책으로 relocator만 붙일 수 있으므로
# 결국 relocator가 재제출한 잡만 예비 노드에 간다. 관리자도 예외 없음 (예비 노드는 복구 전용, 정본 I4)
# JobSet 컨트롤러가 만드는 자식 Job은 이미 검사한 JobSet을 복사한 것이라 통과
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: scheduling-spare-toleration}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [jobset.x-k8s.io]
      apiVersions: ["*"]
      operations: [CREATE, UPDATE]
      resources: [jobsets]
    - apiGroups: [batch]
      apiVersions: ["*"]
      operations: [CREATE, UPDATE]
      resources: [jobs]
  variables:
  - name: podSpecs
    expression: >-
      object.kind == 'JobSet'
        ? (has(object.spec.replicatedJobs) ? object.spec.replicatedJobs.map(rj, rj.template.spec.template.spec) : [])
        : [object.spec.template.spec]
  - name: toleratesSpare
    expression: >-
      variables.podSpecs.exists(s, has(s.tolerations) && s.tolerations.exists(t,
        (has(t.key) && t.key == 'devoops/spare') ||
        ((!has(t.key) || t.key == '') && has(t.operator) && t.operator == 'Exists')))
  - name: recoveryQueue
    expression: >-
      has(object.metadata.labels) && 'kueue.x-k8s.io/queue-name' in object.metadata.labels
        && object.metadata.labels['kueue.x-k8s.io/queue-name'] == 'queue-recovery'
  - name: jobsetChild
    expression: "request.userInfo.username == 'system:serviceaccount:jobset-system:jobset-controller-manager'"
  validations:
  - expression: "!variables.toleratesSpare || variables.recoveryQueue || variables.jobsetChild"
    messageExpression: "'예비 노드(devoops/spare) toleration은 queue-recovery 잡만 가질 수 있음 (정본 I4): ' + object.metadata.name"
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: scheduling-spare-toleration}
spec:
  policyName: scheduling-spare-toleration
  validationActions: [Deny]
